<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPORT - 사업장에서 필요한 AI를 활용한 프로그램 만들기</title>
<style>
:root {
  --ink: #111111;
  --sub: #333333;
  --line: #d9d9d9;
  --accent: #0b6b78;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #ececec; color: var(--ink); }
body {
  font-family: "Batang", "바탕", "Noto Serif KR", "Nanum Myeongjo", "Times New Roman", serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px 12px;
}
.page {
  width: 100%;
  max-width: 794px;
  min-height: 1000px;
  background: #fff;
  box-shadow: 0 2px 16px rgba(0,0,0,.12);
  padding: 96px 56px 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 {
  margin: 0;
  font-family: "Times New Roman", "Batang", serif;
  font-weight: 400;
  font-size: clamp(44px, 9vw, 72px);
  letter-spacing: .02em;
  text-align: center;
}
.title {
  margin: 20px 0 0;
  font-size: clamp(20px, 3.6vw, 28px);
  font-weight: 400;
  color: var(--sub);
  text-align: center;
  word-break: keep-all;
}
.desc {
  margin: 28px 0 0;
  max-width: 560px;
  font-size: clamp(14px, 2.4vw, 17px);
  line-height: 1.85;
  color: #555;
  text-align: center;
  word-break: keep-all;
}
.spacer { flex: 1; min-height: 80px; }
.info {
  width: 100%;
  max-width: 420px;
  margin: 0 0 0 auto;
  border-collapse: collapse;
  font-family: "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
  font-size: 17px;
}
.info th, .info td { padding: 7px 0; text-align: left; font-weight: 400; vertical-align: top; }
.info th { width: 5.5em; letter-spacing: .5em; white-space: nowrap; }
.info th span { letter-spacing: 0; }
.info td::before { content: "|"; display: inline-block; width: 1.8em; text-align: center; color: var(--sub); }
.logo { margin: 48px 0 0; width: 190px; max-width: 50%; height: auto; }
.go {
  margin-top: 36px;
  display: inline-block;
  padding: 14px 28px;
  border: 1.5px solid var(--accent);
  border-radius: 4px;
  color: var(--accent);
  font-family: "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  transition: background .15s, color .15s;
}
.go:hover, .go:focus-visible { background: var(--accent); color: #fff; outline: none; }
.go:focus-visible { box-shadow: 0 0 0 3px rgba(11,107,120,.35); }
.hint {
  margin: 10px 0 0;
  font-family: "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
  font-size: 13px;
  color: #777;
}
@media (max-width: 560px) {
  .page { padding: 64px 24px 40px; min-height: 0; }
  .info { font-size: 15px; margin: 0 auto; }
  .spacer { min-height: 48px; }
}
@media print {
  body { background: #fff; padding: 0; }
  .page { box-shadow: none; min-height: 0; height: 277mm; }
  .go, .hint { display: none; }
}
</style>
</head>
